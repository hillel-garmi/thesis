name: arXiv pre-flight
on: [push, workflow_dispatch]

jobs:
  arxiv-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Clean and compile LaTeX
        uses: YuZh98/latex2arxiv@v1.2.0
        id: clean
        with:
          input: tex/        # directory of .tex sources, or a .zip path
          main: main.tex       # optional; auto-detected from \documentclass
          flatten: true         # optional; default false; flatten the directory structure
          dry-run: false        # optional; default false; don't actually create the .zip
      - name: Upload compiled arXiv package
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-package-${{ github.sha }}
          path: ${{ steps.clean.outputs.cleaned-zip }}
          retention-days: 30
